<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Project: Sign Up Form</title>
  </head>
  <body>
    <!-- left side  -->
    <div class="main-container">
      <div class="image-container">
        <div class="logo-container">
          <img src="odinlogo.png" alt="odinlogo" class="odin-logo" />
          <h1 class="odin-title">ODIN</h1>
        </div>
        <p>Photo by Halie West on Unsplash</p>
      </div>

      <!-- right side -->
      <div class="info-container">
        <form action="#" method="POST">
          <div class="info-header">
            <p>
              This is not a real online service! You know you need something
              like this in your life to help you realize your deepest dreams.
              Sign up now to get started.
            </p>
            <p>You know you want to</p>
          </div>

          <div class="form-input">
            <div class="info-inputs">
              <legend>Let's do this!</legend>

              <div class="two-column">
                <div class="input-group">
                  <label for="firstname">FIRST NAME</label>
                  <input type="text" id="firstname" name="firstname" />
                </div>
                <div class="input-group">
                  <label for="lastname">LAST NAME</label>
                  <input type="text" id="lastname" name="lastname" />
                </div>
              </div>

              <div class="two-column">
                <div class="input-group">
                  <label for="email">EMAIL</label>
                  <input type="email" id="email" name="email" />
                </div>
                <div class="input-group">
                  <label for="tel">PHONE NUMBER</label>
                  <input type="tel" id="tel" name="tel" />
                </div>
              </div>

              <div class="two-column">
                <div class="input-group">
                  <label for="password">PASSWORD</label>
                  <input
                    type="password"
                    id="password"
                    name="password"
                    required
                  />
                </div>
                <div class="input-group">
                  <label for="confirm_password">CONFIRM PASSWORD</label>
                  <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                  />
                </div>
              </div>
            </div>
          </div>

          <div class="info-submit">
            <button class="info-button" type="submit">Create Account</button>
            <p>
              Already have an account?<button class="btn-account-login">
                <strong>Log In</strong>
              </button>
            </p>
             </div>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
